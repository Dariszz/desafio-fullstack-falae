services:
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s

  api:
    build:
      context: .
      target: api
    init: true
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-falae}:${POSTGRES_PASSWORD:-falae_local}@postgres:5432/${POSTGRES_DB:-falae}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  worker:
    build:
      context: .
      target: worker
    init: true
    restart: unless-stopped
    ports:
      - "${WORKER_METRICS_PORT:-3002}:3002"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-falae}:${POSTGRES_PASSWORD:-falae_local}@postgres:5432/${POSTGRES_DB:-falae}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-falae_local}
      ANALYSIS_API_URL: http://mock-analysis-api:4000
      ANALYSIS_TIMEOUT_MS: ${ANALYSIS_TIMEOUT_MS:-5000}
      REVIEW_MAX_ATTEMPTS: ${REVIEW_MAX_ATTEMPTS:-4}
      OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-30}
      WORKER_METRICS_PORT: 3002
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mock-analysis-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - "fetch('http://127.0.0.1:3002/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-falae}:${POSTGRES_PASSWORD:-falae_local}@postgres:5432/${POSTGRES_DB:-falae}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-falae}
      POSTGRES_USER: ${POSTGRES_USER:-falae}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-falae_local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-falae_local}",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-falae_local}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  mock-analysis-api:
    build:
      context: ./mock-analysis-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MOCK_API_PORT:-4000}:4000"
    environment:
      PORT: 4000
      MIN_DELAY_MS: ${MIN_DELAY_MS:-250}
      MAX_DELAY_MS: ${MAX_DELAY_MS:-900}
      FAIL_EVERY_N: ${FAIL_EVERY_N:-5}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-10}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-10000}
      RETRY_AFTER_SECONDS: ${RETRY_AFTER_SECONDS:-2}
      SLOW_EXTRA_DELAY_MS: ${SLOW_EXTRA_DELAY_MS:-2500}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-before-sharing}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  integration-postgres:
    profiles: ["integration"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: falae_integration
      POSTGRES_USER: falae_integration
      POSTGRES_PASSWORD: falae_integration
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falae_integration -d falae_integration"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  integration-redis:
    profiles: ["integration"]
    image: redis:8-alpine
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--requirepass",
        "falae_integration",
      ]
    environment:
      REDIS_PASSWORD: falae_integration
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  integration-mock-analysis-api:
    profiles: ["integration"]
    build:
      context: ./mock-analysis-api
    environment:
      PORT: 4000
      MIN_DELAY_MS: 10
      MAX_DELAY_MS: 30
      FAIL_EVERY_N: 0
      RATE_LIMIT_MAX: 1000
      RATE_LIMIT_WINDOW_MS: 10000
      RETRY_AFTER_SECONDS: 1
      SLOW_EXTRA_DELAY_MS: 100
      ADMIN_TOKEN: integration-only
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  integration-migrate:
    profiles: ["integration"]
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://falae_integration:falae_integration@integration-postgres:5432/falae_integration
    command:
      - sh
      - -c
      - npm run db:migrate:deploy && touch /tmp/migrations-applied && tail -f /dev/null
    tmpfs:
      - /tmp
    depends_on:
      integration-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/migrations-applied"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  integration-api:
    profiles: ["integration"]
    build:
      context: .
      target: integration-api
    init: true
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://falae_integration:falae_integration@integration-postgres:5432/falae_integration
    depends_on:
      integration-migrate:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  integration-worker:
    profiles: ["integration"]
    build:
      context: .
      target: integration-worker
    init: true
    environment:
      DATABASE_URL: postgresql://falae_integration:falae_integration@integration-postgres:5432/falae_integration
      REDIS_HOST: integration-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: falae_integration
      ANALYSIS_API_URL: http://integration-mock-analysis-api:4000
      ANALYSIS_TIMEOUT_MS: 2000
      REVIEW_MAX_ATTEMPTS: 4
      OUTBOX_RETENTION_DAYS: 30
      WORKER_METRICS_PORT: 3002
    depends_on:
      integration-migrate:
        condition: service_healthy
      integration-redis:
        condition: service_healthy
      integration-mock-analysis-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - "fetch('http://127.0.0.1:3002/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  integration-tests:
    profiles: ["integration"]
    build:
      context: .
      target: integration-tests
    init: true
    environment:
      INTEGRATION_API_URL: http://integration-api:3001
      DATABASE_URL: postgresql://falae_integration:falae_integration@integration-postgres:5432/falae_integration
      REDIS_HOST: integration-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: falae_integration
    depends_on:
      integration-api:
        condition: service_healthy
      integration-worker:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
